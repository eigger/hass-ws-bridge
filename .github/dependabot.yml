version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The exact minimum-HA environment stays fixed; it changes only with a
    # reviewed support-policy change (hacs.json / STANDARDS.md).
    exclude-paths:
      - requirements_test_min.txt
    groups:
      home-assistant-tests:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
