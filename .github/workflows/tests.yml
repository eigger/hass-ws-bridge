# Shared standards: eigger/hass-repo-standards@ba9f3fad8b635c163fb44a4e91b1833cc4ab47b4
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Existing tests use mocked HA modules (unit profile); real-HA migration is tracked
# as an exception in STANDARDS.md. This does not change the declared minimum HA.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ba9f3fad8b635c163fb44a4e91b1833cc4ab47b4
    with:
      domain: ws_bridge
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      test-profile: unit
      pytest-args: tests/ -v
