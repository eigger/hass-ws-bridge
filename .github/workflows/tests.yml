# Shared standards: eigger/hass-repo-standards@0c1592977591ecba077a4666d699840062711201
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Real Home Assistant tests (ha profile). `current` tests the current HA; the
# separate `minimum-ha` job tests the exact declared minimum (hacs.json 2026.9.0)
# and does not raise or change minimum support.
# ha-components installs requirements of the HA platforms the entry forwards
# (e.g. camera → PyTurboJPEG) from the installed HA's own manifests.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: ws_bridge
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: >-
        websocket_api sensor binary_sensor device_tracker switch number select
        button update light cover fan text lock date time datetime event valve
        climate humidifier water_heater siren alarm_control_panel media_player
        image camera
      pytest-args: tests/components/ws_bridge/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: ws_bridge
      python-versions: '["3.14"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2026.9.0'
      test-profile: ha
      ha-components: >-
        websocket_api sensor binary_sensor device_tracker switch number select
        button update light cover fan text lock date time datetime event valve
        climate humidifier water_heater siren alarm_control_panel media_player
        image camera
      pytest-args: tests/components/ws_bridge/ -v
